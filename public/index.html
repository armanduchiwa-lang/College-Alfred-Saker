<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi Assiduité Enseignants</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1e3a5f">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
  :root{
    --bleu:#1e3a5f; --bleu-clair:#e8f0fa; --accent:#2563eb;
    --vert:#15803d; --orange:#b45309; --rouge:#b91c1c;
    --gris:#f4f5f7; --gris-bordure:#d8dce3; --texte:#1f2430;
  }
  *{box-sizing:border-box;}
  body{font-family:"Segoe UI",Arial,sans-serif;margin:0;background:var(--gris);color:var(--texte);}
  header{background:var(--bleu);color:#fff;padding:14px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;}
  header h1{font-size:1.25rem;margin:0;}
  header .sub{font-size:.8rem;opacity:.85;}
  .barre-statut{display:flex;gap:10px;align-items:center;font-size:.8rem;flex-wrap:wrap;}
  .badge{padding:3px 9px;border-radius:12px;background:rgba(255,255,255,.15);}
  nav{display:flex;background:#16283f;flex-wrap:wrap;}
  nav button{background:none;border:none;color:#cfd8e6;padding:12px 18px;cursor:pointer;font-size:.9rem;border-bottom:3px solid transparent;}
  nav button.actif{color:#fff;border-bottom:3px solid var(--accent);background:#1e3a5f;}
  nav button:hover{color:#fff;}
  main{padding:20px;max-width:1100px;margin:0 auto;}
  .carte{background:#fff;border:1px solid var(--gris-bordure);border-radius:10px;padding:18px;margin-bottom:18px;}
  .carte h2{margin-top:0;font-size:1.05rem;color:var(--bleu);}
  .ligne{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
  label{font-size:.82rem;color:#555;display:block;margin-bottom:3px;}
  input,select,textarea,button{font-family:inherit;font-size:.9rem;}
  input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{
    padding:7px 9px;border:1px solid var(--gris-bordure);border-radius:6px;background:#fff;}
  textarea{width:100%;min-height:50px;}
  .btn{background:var(--accent);color:#fff;border:none;padding:8px 14px;border-radius:6px;cursor:pointer;}
  .btn:hover{background:#1d4ed8;}
  .btn.secondaire{background:#fff;color:var(--accent);border:1px solid var(--accent);}
  .btn.danger{background:#fff;color:var(--rouge);border:1px solid var(--rouge);}
  .btn.petit{padding:4px 9px;font-size:.78rem;}
  table{width:100%;border-collapse:collapse;font-size:.85rem;}
  th,td{padding:7px 8px;border-bottom:1px solid var(--gris-bordure);text-align:left;}
  th{background:var(--bleu-clair);color:var(--bleu);font-weight:600;}
  tr:hover td{background:#fafbff;}
  .tag{padding:3px 9px;border-radius:12px;font-size:.78rem;font-weight:600;display:inline-block;}
  .tag.P{background:#dcfce7;color:var(--vert);}
  .tag.R{background:#fef3c7;color:var(--orange);}
  .tag.A{background:#fee2e2;color:var(--rouge);}
  .statut-boutons{display:flex;gap:6px;}
  .statut-boutons button{border:1px solid var(--gris-bordure);background:#fff;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:.82rem;}
  .statut-boutons button.sel-P.actif{background:var(--vert);color:#fff;border-color:var(--vert);}
  .statut-boutons button.sel-R.actif{background:var(--orange);color:#fff;border-color:var(--orange);}
  .statut-boutons button.sel-A.actif{background:var(--rouge);color:#fff;border-color:var(--rouge);}
  .note{font-size:.8rem;color:#666;}
  .alerte{background:#fee2e2;color:var(--rouge);padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:.85rem;}
  .info{background:#e0f2fe;color:#075985;padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:.85rem;}
  .grille-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:700px){.grille-2{grid-template-columns:1fr;}}
  .sous-onglets{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
  .sous-onglets button{padding:6px 12px;border-radius:6px;border:1px solid var(--gris-bordure);background:#fff;cursor:pointer;font-size:.82rem;}
  .sous-onglets button.actif{background:var(--bleu);color:#fff;border-color:var(--bleu);}
  .surbrillance{background:#fee2e2 !important;}
  .cache{display:none !important;}
  .petit-texte{font-size:.78rem;color:#777;}
  .tag.G{background:#ede9fe;color:#5b21b6;margin-right:6px;}
  tr.mixte td{background:#fffbeb;}
  tr.mixte-debut td{border-top:2px solid #f59e0b;}
  .avert-conflit{font-size:.75rem;color:var(--orange);margin-top:3px;}
</style>
</head>
<body>
<header>
  <div>
    <h1 id="titreEtablissement">Suivi Assiduité Enseignants</h1>
    <div class="sub" id="sousTitre">Collège — CAE / CPE</div>
  </div>
  <div class="barre-statut">
    <span class="badge" id="badgeProfil">Aucun profil sélectionné</span>
    <span class="badge" id="badgeSync">Connexion...</span>
    <button class="btn secondaire petit" id="btnRecharger">🔄 Recharger</button>
  </div>
</header>
<nav id="navPrincipale"></nav>
<main id="contenu"></main>

<script>
(function(){
"use strict";

/* ---------- Utilitaires ---------- */
function uid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-'+Date.now()+'-'+Math.random().toString(16).slice(2);
}
function maintenant(){ return new Date().toISOString(); }
const JOURS = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const JOURS_ECOLE = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
function jourDeDate(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return JOURS[d.getDay()];
}
function fmtDate(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('fr-FR',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'});
}
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtDateCourte(dateStr){
  const p = (dateStr||'').split('-');
  return p.length===3 ? p[2]+'/'+p[1]+'/'+p[0] : (dateStr||'');
}
function enMinutes(h){
  if(!h || !/^\d{1,2}:\d{2}$/.test(h)) return null;
  const p = h.split(':').map(Number);
  return p[0]*60+p[1];
}
/* Minutes de retard = heure d'arrivée - heure de début du cours (jamais négatif) */
function calculerRetardMin(heureDebut, heureArrivee){
  const d = enMinutes(heureDebut), a = enMinutes(heureArrivee);
  if(d==null || a==null) return null;
  return Math.max(0, a-d);
}
function minutesRetardReleve(r, creneau){
  if(!r || r.statut!=='R' || !creneau) return '';
  const m = calculerRetardMin(creneau.heureDebut, r.heureArrivee);
  return m==null ? '' : m;
}
function texteBadgeRetard(heureDebut, heureArrivee){
  const m = calculerRetardMin(heureDebut, heureArrivee);
  if(m==null) return "⏱ Saisissez l'heure d'arrivée";
  if(enMinutes(heureArrivee) < enMinutes(heureDebut)) return "⚠️ Arrivée avant le début du cours (0 min)";
  return "⏱ "+m+" min de retard";
}
function echap(s){
  return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- État ---------- */
function donneesVides(){
  return {
    meta:{ titre:'Suivi Assiduité Enseignants', etablissement:'', seuilAlerte:3, updatedAt:maintenant() },
    cycles:[], classes:[], enseignants:[], emploiDuTemps:[], caes:[], cpes:[], affectations:[], releves:[]
  };
}
let DATA = donneesVides();
let PROFIL = null; // {role:'CAE'|'CPE', id, nom}
let ONGLET = 'accueil';
let SOUS_ONGLET_CONFIG = 'classes';
let JOUR_EDT_ACTIF = 'Lundi';
let EXTRA_LIGNES = {}; // nombre de lignes (groupes) voulu par créneau horaire : classe|jour|début
let codeAcces = '';
let connecteServeur = false;
let derniereSynchro = null;
let synchroEnCours = false;

/* ---------- Fusion (merge) des données ---------- */
function fusionnerCollection(a, b){
  const map = new Map();
  (a||[]).forEach(x=>map.set(x.id,x));
  (b||[]).forEach(x=>{
    const existant = map.get(x.id);
    if(!existant || (x.updatedAt||'') > (existant.updatedAt||'')) map.set(x.id,x);
  });
  return Array.from(map.values());
}
function fusionnerDonnees(local, distant){
  if(!distant) return local;
  const meta = (distant.meta && distant.meta.updatedAt>local.meta.updatedAt) ? distant.meta : local.meta;
  return {
    meta,
    cycles: fusionnerCollection(local.cycles, distant.cycles),
    classes: fusionnerCollection(local.classes, distant.classes),
    enseignants: fusionnerCollection(local.enseignants, distant.enseignants),
    emploiDuTemps: fusionnerCollection(local.emploiDuTemps, distant.emploiDuTemps),
    caes: fusionnerCollection(local.caes, distant.caes),
    cpes: fusionnerCollection(local.cpes, distant.cpes),
    affectations: fusionnerCollection(local.affectations, distant.affectations),
    releves: fusionnerCollection(local.releves, distant.releves)
  };
}

/* ---------- Code d'accès (mémorisé sur l'appareil) ---------- */
/* ---------- Code d'accès (mémorisé sur l'appareil) ---------- */
function chargerCodeEnregistre(){
  return localStorage.getItem('suivi_assiduite_code') || '';
}
function enregistrerCodeAcces(v){
  codeAcces = (v||'').trim();
  try{ localStorage.setItem('suivi_assiduite_code', codeAcces); }catch(e){}
}

/* ---------- Synchronisation avec le serveur ---------- */
async function appelApi(chemin, options){
  const opts = options || {};
  opts.headers = Object.assign({'Content-Type':'application/json','x-access-code':codeAcces}, opts.headers||{});
  const rep = await fetch(chemin, opts);
  let corps = null;
  try{ corps = await rep.json(); }catch(e){}
  if(rep.status===401){ connecteServeur=false; majBarreStatut(); throw new Error('Code d\'accès invalide'); }
  if(!rep.ok) throw new Error((corps && corps.erreur) || ('Erreur serveur ('+rep.status+')'));
  return corps;
}
async function chargerDepuisServeur(){
  try{
    const distant = await appelApi('/api/data');
    const fusionne = fusionnerDonnees(DATA, distant);
    const aChange = JSON.stringify(fusionne) !== JSON.stringify(DATA);
    DATA = fusionne;
    connecteServeur = true;
    derniereSynchro = new Date();
    // On ne redessine la page que si des données ont réellement changé,
    // pour ne pas effacer une saisie en cours (champ pas encore validé).
    const enTrainDeSaisir = document.activeElement && ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName);
    if(aChange && !enTrainDeSaisir) render();
    else majBarreStatut();
  }catch(e){
    connecteServeur = false;
    console.warn('Chargement impossible', e);
    majBarreStatut();
  }
}
async function envoyerVersServeur(){
  try{
    const fusionne = await appelApi('/api/sync', {method:'POST', body: JSON.stringify({data: DATA})});
    DATA = fusionne;
    connecteServeur = true;
    derniereSynchro = new Date();
  }catch(e){
    connecteServeur = false;
    console.warn('Synchronisation impossible, les données restent en local pour le moment', e);
  }
  majBarreStatut();
}
function demarrerPolling(){
  setInterval(async ()=>{
    if(synchroEnCours) return;
    synchroEnCours = true;
    try{ await chargerDepuisServeur(); }
    finally{ synchroEnCours = false; }
  }, 7000);
}
async function persister(){
  DATA.meta.updatedAt = maintenant();
  try{ localStorage.setItem('suivi_assiduite_secours', JSON.stringify(DATA)); }catch(e){}
  await envoyerVersServeur();
}

/* ---------- Barre de statut ---------- */
function majBarreStatut(){
  const bp = document.getElementById('badgeProfil');
  bp.textContent = PROFIL ? (PROFIL.role+' — '+PROFIL.nom) : 'Aucun profil sélectionné';
  const bs = document.getElementById('badgeSync');
  if(connecteServeur){
    const h = derniereSynchro || new Date();
    bs.textContent = 'Connecté — synchro '+String(h.getHours()).padStart(2,'0')+':'+String(h.getMinutes()).padStart(2,'0');
  }else{
    bs.textContent = 'Hors ligne — nouvelle tentative en cours...';
  }
  document.getElementById('titreEtablissement').textContent = DATA.meta.etablissement ? DATA.meta.etablissement : 'Suivi Assiduité Enseignants';
  document.getElementById('sousTitre').textContent = DATA.meta.etablissement ? 'Suivi Assiduité Enseignants — CAE / CPE' : 'Collège — CAE / CPE';
}

/* ---------- Navigation ---------- */
const ONGLETS = [
  {id:'accueil', label:'Accueil'},
  {id:'config', label:'Configuration (CPE)'},
  {id:'saisie', label:'Saisie (CAE)'},
  {id:'suivi', label:'Suivi (CPE)'}
];
function construireNav(){
  const nav = document.getElementById('navPrincipale');
  nav.innerHTML = ONGLETS.map(o=>`<button data-onglet="${o.id}" class="${ONGLET===o.id?'actif':''}">${o.label}</button>`).join('');
  nav.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', ()=>{ ONGLET = b.dataset.onglet; render(); });
  });
}

/* ---------- Rendu principal ---------- */
function render(){
  construireNav();
  majBarreStatut();
  const c = document.getElementById('contenu');
  if(ONGLET==='accueil') c.innerHTML = vueAccueil();
  else if(ONGLET==='config') c.innerHTML = vueConfig();
  else if(ONGLET==='saisie') c.innerHTML = vueSaisie();
  else if(ONGLET==='suivi') c.innerHTML = vueSuivi();
  attacherEvenements();
}

/* ---------- Vue Accueil ---------- */
function vueAccueil(){
  let html = `<div class="carte"><h2>Bienvenue</h2>
  <p>Cet outil permet aux <strong>CAE</strong> de relever la présence, les retards et les absences des enseignants dans les classes qui leur sont assignées, et aux <strong>CPE</strong> de configurer les classes, l'emploi du temps, les affectations et de suivre les relevés.</p>
  <p class="note">Les données sont stockées en ligne : chacun peut se connecter depuis son téléphone ou son ordinateur, avec ou sans le WiFi du collège.</p></div>`;

  html += `<div class="carte"><h2>Connexion au serveur</h2>`;
  if(connecteServeur){
    html += `<p class="note">✅ Connecté au serveur.</p>`;
  }else{
    html += `<div class="alerte">⚠️ Non connecté. Vérifiez le code d'accès ci-dessous (donné par un CPE) et votre connexion internet.</div>`;
  }
  html += `<div class="ligne">
      <div><label>Code d'accès de l'établissement</label><input type="text" id="champCodeAcces" value="${echap(codeAcces)}" placeholder="ex: college2026"></div>
      <div style="align-self:flex-end;"><button class="btn" id="btnEnregistrerCode">Se connecter</button></div>
    </div></div>`;

  html += `<div class="carte"><h2>Qui êtes-vous ?</h2>`;
  if(PROFIL){
    html += `<p>Connecté en tant que <strong>${echap(PROFIL.role)} — ${echap(PROFIL.nom)}</strong>.</p>
    <button class="btn secondaire" id="btnChangerProfil">Changer de profil</button>`;
  }else{
    html += `<div class="ligne">
      <div><label>Je suis</label>
      <select id="selRole">
        <option value="CAE">CAE</option>
        <option value="CPE">CPE</option>
      </select></div>
      <div><label>Mon nom</label>
      <select id="selNomProfil"></select></div>
      <div id="zoneMdpCPE" class="cache"><label>Mot de passe</label><input type="password" id="champMdpCPE"></div>
      <div style="align-self:flex-end;"><button class="btn" id="btnValiderProfil">Continuer</button></div>
    </div>
    <p class="petit-texte">Les CAE n'ont pas de mot de passe. Les CPE doivent saisir leur mot de passe (défini dans Configuration → CAE &amp; CPE). Si votre nom n'apparaît pas dans la liste, demandez à un CPE de l'ajouter.</p>`;
  }
  html += `</div>`;
  return html;
}

/* ---------- Vue Configuration (CPE) ---------- */
const SOUS_ONGLETS_CONFIG = [
  {id:'general', label:'Général'},
  {id:'cycles', label:'Cycles'},
  {id:'classes', label:'Classes'},
  {id:'enseignants', label:'Enseignants'},
  {id:'edt', label:'Emploi du temps'},
  {id:'personnes', label:'CAE & CPE'},
  {id:'affectations', label:'Affectations'}
];
function vueConfig(){
  let html = `<div class="sous-onglets">`+SOUS_ONGLETS_CONFIG.map(s=>`<button data-sc="${s.id}" class="${SOUS_ONGLET_CONFIG===s.id?'actif':''}">${s.label}</button>`).join('')+`</div>`;
  if(SOUS_ONGLET_CONFIG==='general') html += vueConfigGeneral();
  else if(SOUS_ONGLET_CONFIG==='cycles') html += vueConfigCycles();
  else if(SOUS_ONGLET_CONFIG==='classes') html += vueConfigClasses();
  else if(SOUS_ONGLET_CONFIG==='enseignants') html += vueConfigEnseignants();
  else if(SOUS_ONGLET_CONFIG==='edt') html += vueConfigEDT();
  else if(SOUS_ONGLET_CONFIG==='personnes') html += vueConfigPersonnes();
  else if(SOUS_ONGLET_CONFIG==='affectations') html += vueConfigAffectations();
  return html;
}
function vueConfigGeneral(){
  return `<div class="carte"><h2>Paramètres généraux</h2>
    <div class="ligne">
      <div><label>Nom de l'établissement</label><input type="text" id="champEtablissement" value="${echap(DATA.meta.etablissement)}"></div>
      <div><label>Seuil d'alerte (absences/retards cumulés)</label><input type="number" id="champSeuil" min="1" value="${DATA.meta.seuilAlerte}" style="width:90px;"></div>
      <div style="align-self:flex-end;"><button class="btn" id="btnSauverGeneral">Enregistrer</button></div>
    </div></div>`;
}
function vueConfigCycles(){
  const cycles = DATA.cycles.filter(x=>!x.deleted).sort((a,b)=>a.nom.localeCompare(b.nom));
  const cpes = DATA.cpes.filter(x=>!x.deleted).sort((a,b)=>a.nom.localeCompare(b.nom));
  let html = `<div class="carte"><h2>Cycles</h2>
    <p class="note">Un cycle regroupe plusieurs classes et est géré par un CPE responsable.</p>
    <div class="ligne">
      <div><label>Nom du cycle</label><input type="text" id="champNouvCycle" placeholder="ex: 1er cycle (6ème-3ème)"></div>
      <div><label>CPE responsable</label><select id="champNouvCycleCPE"><option value="">—</option>${cpes.map(p=>`<option value="${p.id}">${echap(p.nom)}</option>`).join('')}</select></div>
      <div style="align-self:flex-end;"><button class="btn" id="btnAjoutCycle">Ajouter</button></div>
    </div>
    <table><thead><tr><th>Cycle</th><th>CPE responsable</th><th>Classes</th><th></th></tr></thead><tbody>`;
  if(!cycles.length) html += `<tr><td colspan="4" class="note">Aucun cycle créé.</td></tr>`;
  cycles.forEach(cy=>{
    const nbClasses = DATA.classes.filter(c=>!c.deleted && c.cycleId===cy.id).length;
    html += `<tr>
      <td><input type="text" data-id="${cy.id}" class="champEditCycleNom" value="${echap(cy.nom)}"></td>
      <td><select data-id="${cy.id}" class="champEditCycleCPE"><option value="">—</option>${cpes.map(p=>`<option value="${p.id}" ${cy.cpeId===p.id?'selected':''}>${echap(p.nom)}</option>`).join('')}</select></td>
      <td>${nbClasses}</td>
      <td><button class="btn danger petit" data-suppr-cycle="${cy.id}">Supprimer</button></td>
    </tr>`;
  });
  html += `</tbody></table></div>`;
  return html;
}
function vueConfigClasses(){
  const lignes = DATA.classes.filter(x=>!x.deleted).sort((a,b)=>a.nom.localeCompare(b.nom));
  const cycles = DATA.cycles.filter(x=>!x.deleted).sort((a,b)=>a.nom.localeCompare(b.nom));
  let html = `<div class="carte"><h2>Classes</h2>`;
  if(!cycles.length) html += `<div class="info">Créez d'abord au moins un cycle (onglet Cycles) pour pouvoir y rattacher vos classes.</div>`;
  html += `<div class="ligne">
    <div><label>Nouvelle classe</label><input type="text" id="champNouvClasse" placeholder="ex: 6ème A"></div>
    <div><label>Cycle</label><select id="champNouvClasseCycle"><option value="">—</option>${cycles.map(cy=>`<option value="${cy.id}">${echap(cy.nom)}</option>`).join('')}</select></div>
    <div style="align-self:flex-end;"><button class="btn" id="btnAjoutClasse">Ajouter</button></div></div>
    <table><thead><tr><th>Classe</th><th>Cycle</th><th></th></tr></thead><tbody>`;
  lignes.forEach(cl=>{
    html += `<tr><td><input type="text" data-id="${cl.id}" class="champEditClasse" value="${echap(cl.nom)}"></td>
    <td><select data-id="${cl.id}" class="champEditClasseCycle"><option value="">—</option>${cycles.map(cy=>`<option value="${cy.id}" ${cl.cycleId===cy.id?'selected':''}>${echap(cy.nom)}</option>`).join('')}</select></td>
    <td><button class="btn danger petit" data-suppr-classe="${cl.id}">Supprimer</button></td></tr>`;
  });
  html += `</tbody></table></div>`;
  return html;
}
function vueConfigEnseignants(){
  const lignes = DATA.enseignants.filter(x=>!x.deleted).sort((a,b)=>a.nom.localeCompare(b.nom));
  let html = `<div class="carte"><h2>Enseignants</h2>
    <div class="ligne">
      <div><label>Nom</label><input type="text" id="champNouvEnsNom" placeholder="ex: M. Ateba"></div>
      <div><label>Matière</label><input type="text" id="champNouvEnsMatiere" placeholder="ex: Mathématiques"></div>
      <div style="align-self:flex-end;"><button class="btn" id="btnAjoutEns">Ajouter</button></div></div>
    <table><thead><tr><th>Nom</th><th>Matière</th><th></th></tr></thead><tbody>`;
  lignes.forEach(e=>{
    html += `<tr><td><input type="text" data-id="${e.id}" class="champEditEnsNom" value="${echap(e.nom)}"></td>
    <td><input type="text" data-id="${e.id}" class="champEditEnsMatiere" value="${echap(e.matiere)}"></td>

const HORAIRES_FIXES = [
  ['07:30','08:20'], ['08:20','09:10'], ['09:10','10:00'],
  ['10:20','11:10'], ['11:10','12:00'],
  ['12:35','13:25'], ['13:25','14:15'], ['14:15','15:05'], ['15:05','15:55']
];
function idCreneauFixe(classeId, jour, heureDebut, rang){
  const base = 'edt_'+classeId+'_'+jour+'_'+heureDebut.replace(':','');
  return rang>0 ? base+'_g'+rang : base; // rang 0 = id historique (compatible avec les données existantes)
}
/* Toutes les entrées d'un même créneau horaire d'une classe (plusieurs si classe mixte) */
function creneauxDuSlot(classeId, jour, debut, fin, inclureSupprimes){
  return DATA.emploiDuTemps
    .filter(x=>x.classeId===classeId && x.jour===jour && x.heureDebut===debut && x.heureFin===fin && (inclureSupprimes || !x.deleted))
    .sort((a,b)=>(a.rang||0)-(b.rang||0));
}
/* Libellé du groupe, uniquement si le créneau est en classe mixte (sinon chaîne vide) */
function libelleGroupe(cr){
  if(!cr) return '';
  const nb = creneauxDuSlot(cr.classeId, cr.jour, cr.heureDebut, cr.heureFin).length;
  if(nb<2) return '';
  return (cr.groupe && cr.groupe.trim()) ? cr.groupe.trim() : 'Groupe '+((cr.rang||0)+1);
}
/* Classes où le même enseignant est déjà placé à la même heure (avertissement non bloquant) */
function conflitsEnseignant(l){
  if(!l || !l.enseignantId) return [];
  return DATA.emploiDuTemps
    .filter(x=>!x.deleted && x.id!==l.id && x.jour===l.jour && x.heureDebut===l.heureDebut && x.enseignantId===l.enseignantId)
    .map(x=>{
      if(x.classeId===l.classeId) return 'un autre groupe de cette classe';
      const cl = DATA.classes.find(c=>c.id===x.classeId);
      return cl ? cl.nom : 'une autre classe';
    });
}

function rendreZoneEDT(classeId){
  const enseignants = DATA.enseignants.filter(x=>!x.deleted).sort((a,b)=>a.nom.localeCompare(b.nom));
  const jour = JOUR_EDT_ACTIF;
  let html = `<table><thead><tr><th>Horaire</th><th>Groupe</th><th>Matière</th><th>Enseignant</th><th></th></tr></thead><tbody>`;
  HORAIRES_FIXES.forEach(([debut, fin])=>{
    const tous = creneauxDuSlot(classeId, jour, debut, fin, true);
    const actifs = tous.filter(x=>!x.deleted);
    const cle = classeId+'|'+jour+'|'+debut;
    const nbVoulu = EXTRA_LIGNES[cle] || 1;
    const lignes = actifs.map(x=>({rang:x.rang||0, l:x}));
    if(!lignes.length) lignes.push({rang:0, l:null});
    const rangsPris = new Set(tous.map(x=>x.rang||0));
    lignes.forEach(it=>rangsPris.add(it.rang));
    let prochain = Math.max.apply(null, Array.from(rangsPris))+1;
    while(lignes.length < nbVoulu){ lignes.push({rang:prochain++, l:null}); }
    const nb = lignes.length;
    const mixte = nb>1;
    lignes.forEach((it,i)=>{
      const l = it.l;
      const attr = `data-classe="${classeId}" data-jour="${jour}" data-debut="${debut}" data-fin="${fin}" data-rang="${it.rang}"`;
      const conflits = conflitsEnseignant(l);
      let actions = '';
      if(mixte) actions += `<button class="btn danger petit btnRetirerGroupe" ${attr} data-nb="${nb}">✖ Retirer</button> `;
      if(i===nb-1) actions += `<button class="btn secondaire petit btnAjoutGroupe" data-classe="${classeId}" data-jour="${jour}" data-debut="${debut}" data-nb="${nb}">➕ ${mixte?'Groupe':'Classe mixte'}</button>`;
      html += `<tr class="${mixte?'mixte'+(i===0?' mixte-debut':''):''}">
        ${i===0?`<td rowspan="${nb}">${debut}–${fin}</td>`:''}
        <td>${mixte?`<input type="text" class="champGroupeFixe" ${attr} value="${l?echap(l.groupe||''):''}" placeholder="Groupe ${i+1}" style="width:110px;">`:'<span class="petit-texte">—</span>'}</td>
        <td><input type="text" class="champMatiereFixe" ${attr} value="${l?echap(l.matiere):''}" placeholder="Matière"></td>
        <td><select class="champEnsFixe" ${attr}>
          <option value="">—</option>${enseignants.map(e=>`<option value="${e.id}" ${l&&l.enseignantId===e.id?'selected':''}>${echap(e.nom)}</option>`).join('')}
        </select>${conflits.length?`<div class="avert-conflit">⚠️ Cet enseignant est déjà placé à cette heure : ${conflits.map(echap).join(', ')}</div>`:''}</td>
        <td>${actions}</td>
      </tr>`;
    });
  });
  html += `</tbody></table>
    <p class="petit-texte">Laissez la matière vide et l'enseignant sur « — » pour un créneau libre (pas de cours).</p>
    <p class="petit-texte"><strong>Classe mixte</strong> : si, à la même heure, une partie de la classe a cours avec un enseignant et l'autre partie travaille une autre matière avec un autre enseignant, cliquez sur « ➕ Classe mixte » à droite de l'horaire, puis renseignez la matière et l'enseignant de chaque groupe (nom du groupe facultatif, ex. « Groupe A »).</p>`;
  document.getElementById('zoneEDT').innerHTML = html;
  attacherEvenementsEDT();
}
async function majCreneauFixe(classeId, jour, debut, fin, rang, champ, valeur){
  rang = parseInt(rang)||0;
  const id = idCreneauFixe(classeId, jour, debut, rang);
  let l = DATA.emploiDuTemps.find(x=>x.id===id);
  if(!l){
    l = {id, classeId, jour, heureDebut:debut, heureFin:fin, rang, groupe:'', matiere:'', enseignantId:'', updatedAt:maintenant(), deleted:false};
    DATA.emploiDuTemps.push(l);
  }
  l.rang = rang;
  l[champ] = valeur;
  l.deleted = !(l.matiere && l.matiere.trim()) && !l.enseignantId;
  l.updatedAt = maintenant();
  await persister();
}
async function retirerGroupeEDT(classeId, jour, debut, fin, rang, nb){
  const l = DATA.emploiDuTemps.find(x=>x.id===idCreneauFixe(classeId, jour, debut, rang));
  if(l){ l.deleted = true; l.updatedAt = maintenant(); }
  EXTRA_LIGNES[classeId+'|'+jour+'|'+debut] = Math.max(1, nb-1);
  await persister();
  rendreZoneEDT(classeId);
}
function attacherEvenementsEDT(){
  const lire = el => [el.dataset.classe, el.dataset.jour, el.dataset.debut, el.dataset.fin, el.dataset.rang];
  document.querySelectorAll('.champMatiereFixe').forEach(inp=>{
    inp.addEventListener('change', ()=> majCreneauFixe(...lire(inp), 'matiere', inp.value.trim()));
  });
  document.querySelectorAll('.champGroupeFixe').forEach(inp=>{
    inp.addEventListener('change', ()=> majCreneauFixe(...lire(inp), 'groupe', inp.value.trim()));
  });
  document.querySelectorAll('.champEnsFixe').forEach(sel=>{
    sel.addEventListener('change', async ()=>{
      await majCreneauFixe(...lire(sel), 'enseignantId', sel.value);
      rendreZoneEDT(sel.dataset.classe); // met à jour l'avertissement de conflit éventuel
    });
  });
  document.querySelectorAll('.btnAjoutGroupe').forEach(b=>{
    b.addEventListener('click', ()=>{
      EXTRA_LIGNES[b.dataset.classe+'|'+b.dataset.jour+'|'+b.dataset.debut] = (parseInt(b.dataset.nb)||1)+1;
      rendreZoneEDT(b.dataset.classe);
    });
  });
  document.querySelectorAll('.btnRetirerGroupe').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(!confirm('Retirer ce groupe de cet horaire ?')) return;
      retirerGroupeEDT(b.dataset.classe, b.dataset.jour, b.dataset.debut, b.dataset.fin, b.dataset.rang, parseInt(b.dataset.nb)||1);
    });
  });
}

/* ---------- Vue Suivi (CPE) ---------- */
function vueSuivi(){
  const cyclesTous = DATA.cycles.filter(x=>!x.deleted).sort((a,b)=>a.nom.localeCompare(b.nom));
  const caes = DATA.caes.filter(x=>!x.deleted).sort((a,b)=>a.nom.localeCompare(b.nom));
  const enseignants = DATA.enseignants.filter(x=>!x.deleted).sort((a,b)=>a.nom.localeCompare(b.nom));

  const debut = document.getElementById('filtreDebut') ? document.getElementById('filtreDebut').value : (function(){const d=new Date();d.setDate(d.getDate()-7);return d.toISOString().slice(0,10);})();
  const fin = document.getElementById('filtreFin') ? document.getElementById('filtreFin').value : todayStr();
  // Par défaut, un CPE connecté voit d'abord le(s) cycle(s) dont il/elle est responsable
  const cycleParDefaut = (function(){
    if(!PROFIL || PROFIL.role!=='CPE') return '';
    const mesCycles = cyclesTous.filter(cy=>cy.cpeId===PROFIL.id);
    return mesCycles.length===1 ? mesCycles[0].id : '';
  })();
  const filtreCycle = document.getElementById('filtreCycle') ? document.getElementById('filtreCycle').value : cycleParDefaut;
  const classes = DATA.classes.filter(x=>!x.deleted && (!filtreCycle || x.cycleId===filtreCycle)).sort((a,b)=>a.nom.localeCompare(b.nom));
  const filtreClasse = document.getElementById('filtreClasse') ? document.getElementById('filtreClasse').value : '';
  const filtreEns = document.getElementById('filtreEns') ? document.getElementById('filtreEns').value : '';
  const filtreCAE = document.getElementById('filtreCAE') ? document.getElementById('filtreCAE').value : '';

  let html = `<div class="carte"><h2>Filtres</h2><div class="ligne">
    <div><label>Du</label><input type="date" id="filtreDebut" value="${debut}"></div>
    <div><label>Au</label><input type="date" id="filtreFin" value="${fin}"></div>
    <div><label>Cycle</label><select id="filtreCycle"><option value="">Tous</option>${cyclesTous.map(cy=>`<option value="${cy.id}" ${filtreCycle===cy.id?'selected':''}>${echap(cy.nom)}</option>`).join('')}</select></div>
    <div><label>Classe</label><select id="filtreClasse"><option value="">Toutes</option>${classes.map(c=>`<option value="${c.id}" ${filtreClasse===c.id?'selected':''}>${echap(c.nom)}</option>`).join('')}</select></div>
    <div><label>Enseignant</label><select id="filtreEns"><option value="">Tous</option>${enseignants.map(e=>`<option value="${e.id}" ${filtreEns===e.id?'selected':''}>${echap(e.nom)}</option>`).join('')}</select></div>
    <div><label>CAE</label><select id="filtreCAE"><option value="">Tous</option>${caes.map(p=>`<option value="${p.id}" ${filtreCAE===p.id?'selected':''}>${echap(p.nom)}</option>`).join('')}</select></div>
    <div style="align-self:flex-end;"><button class="btn secondaire" id="btnAppliquerFiltres">Appliquer</button></div>
    <div style="align-self:flex-end;"><button class="btn secondaire" id="btnExportCSV">⬇️ Export CSV</button></div>
    <div style="align-self:flex-end;"><button class="btn" id="btnExportWord">📄 Export Word</button></div>
  </div></div>`;

  const classeDansCycle = (classeId)=>{
    if(!filtreCycle) return true;
    const cl = DATA.classes.find(c=>c.id===classeId);
    return cl && cl.cycleId===filtreCycle;
  };

  let releves = DATA.releves.filter(r=>!r.deleted && r.date>=debut && r.date<=fin && classeDansCycle(r.classeId) && r.statut!=='P');
  if(filtreClasse) releves = releves.filter(r=>r.classeId===filtreClasse);
  if(filtreEns) releves = releves.filter(r=>r.enseignantId===filtreEns);
  if(filtreCAE) releves = releves.filter(r=>r.caeId===filtreCAE);
  releves.sort((a,b)=> a.date.localeCompare(b.date) || a.creneauId.localeCompare(b.creneauId));

  // Bilan récapitulatif par enseignant, sur toutes ses classes du cycle filtré (indépendant du filtre Classe)
  let relevesRecap = DATA.releves.filter(r=>!r.deleted && r.date>=debut && r.date<=fin && classeDansCycle(r.classeId));
  if(filtreEns) relevesRecap = relevesRecap.filter(r=>r.enseignantId===filtreEns);
  if(filtreCAE) relevesRecap = relevesRecap.filter(r=>r.caeId===filtreCAE);

  // Par enseignant : total absences, total retards, total minutes de retard
  const statsParEns = {};
  relevesRecap.forEach(r=>{
    if(r.statut!=='A' && r.statut!=='R') return;
    if(!statsParEns[r.enseignantId]) statsParEns[r.enseignantId] = {absences:0, retards:0, minutes:0};
    const s = statsParEns[r.enseignantId];
    if(r.statut==='A') s.absences++;
    else{
      s.retards++;
      const cr = DATA.emploiDuTemps.find(c=>c.id===r.creneauId);
      const m = cr ? calculerRetardMin(cr.heureDebut, r.heureArrivee) : null;
      s.minutes += (m==null ? 0 : m);
    }
  });

  const nomCycleFiltre = filtreCycle ? (cyclesTous.find(cy=>cy.id===filtreCycle)||{}).nom : 'tous cycles confondus';
  html += `<div class="carte"><h2>Bilan récapitulatif par enseignant (${echap(nomCycleFiltre)}, période ${fmtDate(debut)} au ${fmtDate(fin)})</h2>`;
  const ensIds = Object.keys(statsParEns).sort((a,b)=>{
    const ea = DATA.enseignants.find(e=>e.id===a), eb = DATA.enseignants.find(e=>e.id===b);
    return (ea?ea.nom:'').localeCompare(eb?eb.nom:'');
  });
  if(!ensIds.length){
    html += `<p class="note">Aucune absence ni aucun retard sur cette période.</p></div>`;
  }else{
    let tA=0, tR=0, tM=0;
    html += `<table><thead><tr><th>Enseignant</th><th>Total absences</th><th>Total retards</th><th>Total minutes de retard</th></tr></thead><tbody>`;
    ensIds.forEach(ensId=>{
      const ens = DATA.enseignants.find(e=>e.id===ensId);
      const s = statsParEns[ensId];
      tA += s.absences; tR += s.retards; tM += s.minutes;
      const alerte = (s.absences+s.retards) >= (DATA.meta.seuilAlerte||3);
      html += `<tr class="${alerte?'surbrillance':''}"><td>${ens?echap(ens.nom):'—'}</td><td>${s.absences}</td><td>${s.retards}</td><td>${s.minutes} min</td></tr>`;
    });
    html += `<tr style="font-weight:700;background:#f4f7fc;"><td>Total général</td><td>${tA}</td><td>${tR}</td><td>${tM} min</td></tr>`;
    html += `</tbody></table></div>`;
  }

  html += `<div class="carte"><h2>Détail des absences et retards (${releves.length})</h2>
    <div style="overflow-x:auto;"><table><thead><tr>${COLONNES_DETAIL.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>`;
  lignesDetail(releves).forEach(l=>{
    const tag = l[6]==='Retard' ? 'R' : 'A';
    html += `<tr>`+l.map((v,i)=> i===6 ? `<td><span class="tag ${tag}">${echap(v)}</span></td>` : `<td>${echap(v)}</td>`).join('')+`</tr>`;
  });
  if(!releves.length) html += `<tr><td colspan="10" class="note">Aucune absence ni retard sur cette période.</td></tr>`;
  html += `</tbody></table></div></div>`;
  return html;
}

/* ---------- Tableau de détail (même structure que le modèle Word) ---------- */
const COLONNES_DETAIL = ['Date','Classe','Jour','Horaire','Enseignant','Matière','Statut','Nombre de min de retard','Commentaire','CAE'];
function lignesDetail(releves){
  return releves.map(r=>{
    const creneau = DATA.emploiDuTemps.find(c=>c.id===r.creneauId);
    const classe = DATA.classes.find(c=>c.id===r.classeId);
    const ens = DATA.enseignants.find(e=>e.id===r.enseignantId);
    const cae = DATA.caes.find(p=>p.id===r.caeId);
    const grp = creneau ? libelleGroupe(creneau) : '';
    const nomClasse = (classe?classe.nom:'—') + (grp ? ' ('+grp+')' : '');
    const min = minutesRetardReleve(r, creneau);
    return [
      fmtDateCourte(r.date),
      nomClasse,
      jourDeDate(r.date),
      creneau ? creneau.heureDebut+'–'+creneau.heureFin : '—',
      ens ? ens.nom : '—',
      (creneau && creneau.matiere) || (ens && ens.matiere) || '',
      r.statut==='R' ? 'Retard' : 'Absent',
      min===''? '' : String(min),
      r.commentaire || '',
      cae ? cae.nom : '—'
    ];
  });
}
/* Relevés (absences + retards) correspondant aux filtres affichés à l'écran */
function relevesFiltres(){
  const debut = document.getElementById('filtreDebut').value;
  const fin = document.getElementById('filtreFin').value;
  const filtreCycle = document.getElementById('filtreCycle') ? document.getElementById('filtreCycle').value : '';
  const filtreClasse = document.getElementById('filtreClasse').value;
  const filtreEns = document.getElementById('filtreEns').value;
  const filtreCAE = document.getElementById('filtreCAE').value;
  let releves = DATA.releves.filter(r=>!r.deleted && r.date>=debut && r.date<=fin && (r.statut==='R' || r.statut==='A'));
  if(filtreCycle) releves = releves.filter(r=>{ const cl=DATA.classes.find(c=>c.id===r.classeId); return cl && cl.cycleId===filtreCycle; });
  if(filtreClasse) releves = releves.filter(r=>r.classeId===filtreClasse);
  if(filtreEns) releves = releves.filter(r=>r.enseignantId===filtreEns);
  if(filtreCAE) releves = releves.filter(r=>r.caeId===filtreCAE);
  releves.sort((a,b)=> a.date.localeCompare(b.date) || a.creneauId.localeCompare(b.creneauId));
  return {releves, debut, fin};
}
function libelleFiltre(selId, tousLabel){
  const el = document.getElementById(selId);
  if(!el || !el.value) return '';
  return el.options[el.selectedIndex].textContent;
}

/* ---------- Export CSV ---------- */
function telecharger(blob, nom){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nom;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function exporterCSV(){
  const f = relevesFiltres();
  const lignes = lignesDetail(f.releves);
  const cellule = v => String(v==null?'':v).replace(/;/g,',').replace(/[\r\n]+/g,' ');
  let csv = COLONNES_DETAIL.join(';')+'\n';
  lignes.forEach(l=>{ csv += l.map(cellule).join(';')+'\n'; });
  telecharger(new Blob(['\ufeff'+csv], {type:'text/csv'}), 'suivi-assiduite-'+f.debut+'-au-'+f.fin+'.csv');
}

/* ---------- Export Word (.docx) — généré sans bibliothèque externe ---------- */
function crc32(octets){
  if(!crc32.table){
    crc32.table = [];
    for(let n=0;n<256;n++){
      let c = n;
      for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1);
      crc32.table[n] = c>>>0;
    }
  }
  let crc = -1;
  for(let i=0;i<octets.length;i++) crc = crc32.table[(crc ^ octets[i]) & 0xFF] ^ (crc>>>8);
  return (crc ^ -1)>>>0;
}
function creerZip(fichiers, mime){
  const enc = new TextEncoder();
  const u16 = n => [n&255, (n>>>8)&255];
  const u32 = n => [n&255, (n>>>8)&255, (n>>>16)&255, (n>>>24)&255];
  const parts = [], central = [];
  let offset = 0;
  fichiers.forEach(f=>{
    const nom = enc.encode(f.nom), data = (typeof f.contenu==='string') ? enc.encode(f.contenu) : f.contenu, crc = crc32(data);
    const local = new Uint8Array([0x50,0x4b,0x03,0x04, ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21),
      ...u32(crc), ...u32(data.length), ...u32(data.length), ...u16(nom.length), ...u16(0)]);
    parts.push(local, nom, data);
    central.push({nom, crc, taille:data.length, offset});
    offset += local.length + nom.length + data.length;
  });
  let tailleCentral = 0;
  central.forEach(c=>{
    const h = new Uint8Array([0x50,0x4b,0x01,0x02, ...u16(20), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21),
      ...u32(c.crc), ...u32(c.taille), ...u32(c.taille), ...u16(c.nom.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(c.offset)]);
    parts.push(h, c.nom);
    tailleCentral += h.length + c.nom.length;
  });
  parts.push(new Uint8Array([0x50,0x4b,0x05,0x06, ...u16(0), ...u16(0), ...u16(central.length), ...u16(central.length),
    ...u32(tailleCentral), ...u32(offset), ...u16(0)]));

const ENTETE_COLLEGE_DIM = {w:960, h:94};
function xmlEchap(t){
  return String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
}
function wParagraphe(texte, opts){
  opts = opts || {};
  const rpr = '<w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri"/>'+(opts.gras?'<w:b/>':'')+
    (opts.couleur?'<w:color w:val="'+opts.couleur+'"/>':'')+'<w:sz w:val="'+(opts.taille||20)+'"/></w:rPr>';
  return '<w:p><w:pPr><w:spacing w:before="'+(opts.avant||0)+'" w:after="'+(opts.apres||60)+'"/>'+
    (opts.centre?'<w:jc w:val="center"/>':'')+'</w:pPr><w:r>'+rpr+'<w:t xml:space="preserve">'+xmlEchap(texte)+'</w:t></w:r></w:p>';
}
function wCellule(texte, largeur, entete, centre){
  const opts = entete ? {gras:true, couleur:'FFFFFF', taille:19, apres:0, centre:true} : {taille:19, apres:0, centre:centre};
  return '<w:tc><w:tcPr><w:tcW w:w="'+largeur+'" w:type="dxa"/>'+
    (entete?'<w:shd w:val="clear" w:color="auto" w:fill="1E3A5F"/>':'')+
    '<w:vAlign w:val="center"/></w:tcPr>'+wParagraphe(texte, opts)+'</w:tc>';
}
function construireDocx(titre, sousTitres, colonnes, lignes, bilan, entete){
  // Page A4 paysage (largeur utile = 16838 - 2*720 = 15398 twips)
  const largeurs = [1200,1800,1100,1400,2200,1700,1100,1400,2298,1200];
  const bord = ['top','left','bottom','right','insideH','insideV'].map(b=>'<w:'+b+' w:val="single" w:sz="4" w:space="0" w:color="808080"/>').join('');
  let corps = '';
  if(entete){
    const cx = 15398*635, cy = Math.round(cx*ENTETE_COLLEGE_DIM.h/ENTETE_COLLEGE_DIM.w);
    corps += '<w:p><w:pPr><w:spacing w:before="0" w:after="160"/><w:jc w:val="center"/></w:pPr><w:r><w:drawing>'+
      '<wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="'+cx+'" cy="'+cy+'"/><wp:docPr id="1" name="Entête du collège" descr="Entête du collège"/>'+
      '<a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">'+
      '<pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="0" name="entete.png"/><pic:cNvPicPr/></pic:nvPicPr>'+
      '<pic:blipFill><a:blip r:embed="rId1"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>'+
      '<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="'+cx+'" cy="'+cy+'"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic>'+
      '</a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>';
  }
  corps += wParagraphe(titre, {gras:true, taille:32, couleur:'1E3A5F', apres:80, centre:true});
  sousTitres.forEach(t=>{ corps += wParagraphe(t, {taille:21, apres:40, centre:true}); });
  corps += wParagraphe('', {apres:80});
  let tbl = '<w:tbl><w:tblPr><w:tblW w:w="15398" w:type="dxa"/><w:tblBorders>'+bord+'</w:tblBorders><w:tblLayout w:type="fixed"/>'+
    '<w:tblCellMar><w:top w:w="40" w:type="dxa"/><w:left w:w="80" w:type="dxa"/><w:bottom w:w="40" w:type="dxa"/><w:right w:w="80" w:type="dxa"/></w:tblCellMar></w:tblPr>'+
    '<w:tblGrid>'+largeurs.map(w=>'<w:gridCol w:w="'+w+'"/>').join('')+'</w:tblGrid>';
  tbl += '<w:tr><w:trPr><w:cantSplit/><w:tblHeader/></w:trPr>'+colonnes.map((c,i)=>wCellule(c, largeurs[i], true)).join('')+'</w:tr>';
  if(!lignes.length){
    tbl += '<w:tr><w:tc><w:tcPr><w:tcW w:w="15398" w:type="dxa"/><w:gridSpan w:val="10"/></w:tcPr>'+wParagraphe('Aucune absence ni retard sur cette période.', {taille:19, apres:0, centre:true})+'</w:tc></w:tr>';
  }
  lignes.forEach(l=>{
    tbl += '<w:tr><w:trPr><w:cantSplit/></w:trPr>'+l.map((v,i)=>wCellule(v, largeurs[i], false, i===6||i===7)).join('')+'</w:tr>';
  });
  tbl += '</w:tbl>';
  corps += tbl;
  if(bilan) corps += wParagraphe(bilan, {gras:true, taille:20, avant:160});
  const sect = '<w:sectPr><w:pgSz w:w="16838" w:h="11906" w:orient="landscape"/><w:pgMar w:top="720" w:right="720" w:bottom="720" w:left="720" w:header="400" w:footer="400" w:gutter="0"/></w:sectPr>';
  const documentXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"><w:body>'+corps+sect+'</w:body></w:document>';
  const contentTypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
    '<Default Extension="xml" ContentType="application/xml"/>'+'<Default Extension="png" ContentType="image/png"/>'+
    '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>';
  const rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>';
  const docRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    (entete ? '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/entete.png"/>' : '')+
    '</Relationships>';
  const fichiers = [
    {nom:'[Content_Types].xml', contenu:contentTypes},
    {nom:'_rels/.rels', contenu:rels},
    {nom:'word/_rels/document.xml.rels', contenu:docRels},
    {nom:'word/document.xml', contenu:documentXml}
  ];
  if(entete) fichiers.push({nom:'word/media/entete.png', contenu:entete});
  return creerZip(fichiers, 'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
}
function exporterWord(){
  const f = relevesFiltres();
  const lignes = lignesDetail(f.releves);
  const titre = 'Détail des absences et retards des enseignants';
  const sous = ['Période : du '+fmtDateCourte(f.debut)+' au '+fmtDateCourte(f.fin)];
  const filtres = [
    ['Cycle', libelleFiltre('filtreCycle')], ['Classe', libelleFiltre('filtreClasse')],
    ['Enseignant', libelleFiltre('filtreEns')], ['CAE', libelleFiltre('filtreCAE')]
  ].filter(x=>x[1]).map(x=>x[0]+' : '+x[1]);
  if(filtres.length) sous.push('Filtres : '+filtres.join(' | '));
  const nbA = f.releves.filter(r=>r.statut==='A').length;
  const nbR = f.releves.filter(r=>r.statut==='R').length;
  const totalMin = lignes.reduce((t,l)=> t + (parseInt(l[7])||0), 0);
  const bilan = 'Total : '+nbA+' absence(s), '+nbR+' retard(s), '+totalMin+' minute(s) de retard cumulée(s).';
  let entete = null;
  try{ entete = Uint8Array.from(atob(ENTETE_COLLEGE_B64), c=>c.charCodeAt(0)); }catch(e){ entete = null; }
  const blob = construireDocx(titre, sous, COLONNES_DETAIL, lignes, bilan, entete);
  telecharger(blob, 'suivi-assiduite-'+f.debut+'-au-'+f.fin+'.docx');
}

/* ---------- Démarrage ---------- */
async function demarrer(){
  // charger sauvegarde locale de secours (utile hors-ligne, en attendant la connexion au serveur)
  try{
    const secours = localStorage.getItem('suivi_assiduite_secours');
    if(secours) DATA = fusionnerDonnees(DATA, JSON.parse(secours));
  }catch(e){}
  // reprendre le profil de la session
  try{
    const p = sessionStorage.getItem('profilCourant');
    if(p) PROFIL = JSON.parse(p);
  }catch(e){}
  // code d'accès mémorisé sur cet appareil (formulaire visible sur l'accueil s'il manque ou est invalide)
  codeAcces = chargerCodeEnregistre();
  render();
  await chargerDepuisServeur();
  render();
  demarrerPolling();
}

document.getElementById('btnRecharger').addEventListener('click', chargerDepuisServeur);

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('/service-worker.js').catch(()=>{}); });
}

demarrer();
})();
</script>
